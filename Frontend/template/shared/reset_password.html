<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | OSARtech InventoryOS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-page">
    <main class="login-layout">
        <section class="login-showcase" aria-label="InventoryOS introduction">
            <a class="showcase-brand" href="{{ url_for('home') }}" aria-label="InventoryOS home">
                <img src="{{ url_for('static', filename='images/main-logo.png') }}" alt="">
                <span>OSARtech InventoryOS</span>
            </a>
            <div class="showcase-content">
                <img class="showcase-logo" src="{{ url_for('static', filename='images/inventoryos-logo.png') }}" alt="InventoryOS by OSARtech">
                <h1>Create new password.</h1>
                <p>Please enter a strong password for your account.</p>
            </div>
        </section>

        <section class="login-panel" aria-labelledby="reset-title">
            <div class="login-form-wrap">
                <h2 id="reset-title">Reset Password</h2>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <p class="login-message {{ category }}" role="alert">{{ message }}</p>
                    {% endfor %}
                {% endwith %}
                <form class="login-form" action="{{ url_for('reset_password', token=token) }}" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 8 characters" autocomplete="new-password" required minlength="8">
                    <button type="submit" class="login-btn">Update Password</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>

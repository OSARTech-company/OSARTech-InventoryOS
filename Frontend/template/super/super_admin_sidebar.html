<div class="side-taskbar">
    <div class="side-brand">
        <img src="{{ url_for('static', filename='images/main-logo.png', v='20260411b') }}" alt="InventoryOS Logo" class="brand-logo">
        <span>Super Admin</span>
    </div>
    <div class="side-links">
        <a href="{{ url_for('super_admin_dashboard') }}" class="side-link{% if active_page == 'dashboard' %} active{% endif %}">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
        </a>
        <a href="{{ url_for('super_admin_add_user') }}" class="side-link{% if active_page == 'add_user' %} active{% endif %}">
            <i class="fas fa-plus-circle"></i>
            <span>Add Business owners</span>
        </a>
        <a href="{{ url_for('admin_requests') }}" class="side-link{% if active_page == 'onboarding_requests' %} active{% endif %}">
            <i class="fas fa-user-plus"></i>
            <span>Onboarding Requests</span>
        </a>
        <a href="{{ url_for('admin_issues') }}" class="side-link{% if active_page == 'issues' %} active{% endif %}"><i class="fas fa-bug"></i><span>Issue Reports</span></a>
        <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="side-link side-link-logout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </form>
    </div>
</div>
{% include 'shared/_premium_alerts.html' %}
